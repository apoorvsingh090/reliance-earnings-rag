services:
  db:
    image: pgvector/pgvector:pg16
    container_name: reliance-rag-db
    environment:
      POSTGRES_USER: reliance
      POSTGRES_PASSWORD: reliance
      POSTGRES_DB: reliance_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reliance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
